name: Build APK

# Build Re-WearBili APKs on main, pull requests, release tags, or one manual dispatch.
on:
  push:
    branches: ["main"]
    tags: ["v*"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:
    inputs:
      build_type:
        description: "Build type (debug/release/both)"
        required: true
        default: "both"
        type: choice
        options:
          - debug
          - release
          - both

permissions:
  contents: write
  packages: read

env:
  GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.caching=true -Dorg.gradle.parallel=true"

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v6.0.1
        with:
          java-version: "17"
          distribution: temurin
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4.0.4

      - name: Install required Android SDK components
        run: |
          # sdkmanager is the final command in the pipe; disable pipefail only
          # here so yes(1)'s expected SIGPIPE does not hide its exit status.
          set +o pipefail
          yes | sdkmanager --licenses
          set -o pipefail
          sdkmanager "platform-tools" "build-tools;36.0.0" "platforms;android-36"

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Resolve build type
        id: resolve_build_type
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "build_type=${{ inputs.build_type }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "push" ] && [ "${{ startsWith(github.ref, 'refs/tags/v') }}" = "true" ]; then
            echo "build_type=both" >> "$GITHUB_OUTPUT"
          else
            echo "build_type=both" >> "$GITHUB_OUTPUT"
          fi

      - name: Test and build Debug APK
        if: steps.resolve_build_type.outputs.build_type == 'debug' || steps.resolve_build_type.outputs.build_type == 'both'
        run: ./gradlew testDebugUnitTest assembleDebug --stacktrace

      - name: Build Release APK
        if: steps.resolve_build_type.outputs.build_type == 'release' || steps.resolve_build_type.outputs.build_type == 'both'
        run: ./gradlew assembleRelease --stacktrace

      - name: Collect APK artifacts
        if: always()
        run: |
          mkdir -p artifacts
          find app/build/outputs/apk/debug -name "*.apk" -type f 2>/dev/null | while read -r apk; do
            cp -v "$apk" "artifacts/$(basename "$apk" .apk)-debug.apk" 2>/dev/null || true
          done || true
          find app/build/outputs/apk/release -name "*.apk" -type f 2>/dev/null | while read -r apk; do
            cp -v "$apk" "artifacts/" 2>/dev/null || true
          done || true
          echo "=== Collected artifacts ==="
          ls -la artifacts/ || true

      - name: Upload APK artifacts
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: Re-WearBili-APK-${{ github.run_id }}
          path: artifacts/*.apk
          if-no-files-found: warn
          retention-days: 30
          compression-level: 0

      - name: Upload build reports
        if: failure()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: build-reports-${{ github.run_id }}
          path: |
            **/build/reports/
            **/build/outputs/logs/
          if-no-files-found: ignore
          retention-days: 7

      - name: Create GitHub Release and upload APK
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3.0.3
        with:
          tag_name: ${{ github.ref_name }}
          name: Re-WearBili ${{ github.ref_name }}
          generate_release_notes: true
          draft: false
          prerelease: false
          files: artifacts/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  verify:
    name: Lint & Compile Check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/v'))

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v6.0.1
        with:
          java-version: "17"
          distribution: temurin
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4.0.4

      - name: Install required Android SDK components
        run: |
          set +o pipefail
          yes | sdkmanager --licenses
          set -o pipefail
          sdkmanager "platform-tools" "build-tools;36.0.0" "platforms;android-36"

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Run compile check
        run: ./gradlew compileDebugKotlin --stacktrace

      - name: Run lint (release)
        run: ./gradlew lintRelease --stacktrace
        continue-on-error: true
