syntax = "proto3";

option java_package = "cn.spacexc.wearbili.remake.proto.settings";
option java_multiple_files = true;

enum Player {
  VideoPlayer = 0;
  AudioPlayer = 1;
}

enum RecommendSource {
  App = 0;
  Web = 1;
}

enum QuickToolBarFunction {
  History = 0;
  Search = 1;
  Cache = 2;
  Message = 3;
  Favourite = 4;
  None = 5;
}

enum QuickToolBarSlotCount {
  Zero = 0;
  One = 1;
  Two = 2;
}

message QuickToolBarConfiguration {
  QuickToolBarSlotCount slotCount = 1;
  QuickToolBarFunction functionOne = 2;
  QuickToolBarFunction functionTwo = 3;
}

message DanmakuPlayerSettings {
  float alpha = 1;
  float displayArea = 2;
  float fontScale = 3;
  int32 blockLevel = 4;
  bool isNormalDanmakuEnabled = 5;
  bool isAdvanceDanmakuEnabled = 6;
}

enum VideoDecoder {
  Hardware = 0;
  Software = 1;
}

enum VideoDisplaySurface {
  SurfaceView = 0;
  TextureView = 1;
}

enum Theme {
  Light = 0;
  Black = 1;
  Round = 2;
}

// 明暗模式。注意：与 Theme 的区别在于 Theme 控制的是"背景装饰样式"，
// Appearance 控制的是"明暗/配色方案"。二者独立。
enum Appearance {
  FollowSystem = 0;   // 跟随系统
  AlwaysDark = 1;     // 强制深色（本项目默认，与原有硬编码深色 UI 对齐）
  AlwaysLight = 2;    // 强制浅色
  PureBlack = 3;      // 纯黑（OLED 省电）
}

// 动画档位，替代原 hasAnimation 二值开关，用于低性能手表降级
enum AnimationLevel {
  Off = 0;        // 无动画
  Minimal = 1;    // 仅必要过渡
  Standard = 2;   // 标准（默认）
  Full = 3;       // 拉满（Expressive 弹簧动效全开）
}

message Customization {
  bool videoCoverColorAbsorb = 1;
  bool recommendPageLargeCard = 2;
  Theme theme = 3;
  // 4 号字段 themeColor 已废弃（死配置，从未被读取），保留占位避免复用旧 tag
  reserved 4;
  reserved "themeColor";

  // ---- 以下为 2026 改版新增 ----
  Appearance appearance = 5;        // 明暗模式
  bool monetEnabled = 6;            // Monet 动态取色（API 31+）
  bool glassEnabled = 7;            // Haze 液态玻璃效果
  AnimationLevel animationLevel = 8;// 动画档位
  string themeColorHex = 9;         // 自定义主色（#RRGGBB），空则用默认粉色
}

message AppConfiguration {
  QuickToolBarConfiguration toolBarConfiguration = 2;
  bool hasAnimation = 3;
  RecommendSource recommendSource = 4;
  Player defaultPlayer = 5;
  bool haveToolBarTipDisplayed = 6;
  DanmakuPlayerSettings danmakuPlayerSettings = 7;
  float screenDisplayScaleFactor = 8;
  VideoDecoder videoDecoder = 9;
  bool isVideoLowPerformance = 10;
  bool initialized = 11;
  string activatedExperimentFunctions = 12;
  VideoDisplaySurface videoDisplaySurface = 13;
  Customization customization = 14;

  // ---- 2026 改版新增功能开关 ----
  PlaybackEnhancement playback = 15;   // 播放增强（后台播放/自动连播/记忆进度等）
  BrowsingExperience browsing = 16;    // 浏览体验（大屏适配/过滤/密度）
}

/**
 * 播放增强配置。
 *
 * 这些开关都有对应的真实消费点，开启后行为立即改变。
 */
message PlaybackEnhancement {
  bool rememberProgress = 1;        // 记忆播放进度，下次自动续播
  bool autoPlayNext = 2;            // 播完自动连播（分P / 推荐）
  bool backgroundAudio = 3;         // 退到后台继续播放音频
  bool skipOpening = 4;             // 自动跳过片头
  float playbackSpeed = 5;          // 默认倍速（1.0 为正常）
  int32 skipOpeningSeconds = 6;     // 片头跳过秒数
  int32 skipEndingSeconds = 7;      // 片尾跳过秒数
  bool skipEnding = 8;              // 自动跳过片尾
}

/**
 * 浏览体验配置。
 */
message BrowsingExperience {
  bool hideAds = 1;                 // 过滤推广卡片
  bool hideLowQualityCover = 2;     // 隐藏低画质封面（用模糊占位替代表情包封面）
  bool showVideoStats = 3;          // 卡片上显示播放量/弹幕数
  bool longPressMenu = 4;           // 长按卡片弹出快捷菜单
  bool compactMode = 5;             // 紧凑布局（一屏显示更多内容）
  bool autoRotate = 6;              // 允许屏幕自动旋转
}